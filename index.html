<html lang="ru">

        #output-code { width: 100%; height: 120px; background: #000; color: #0f9; font-family: monospace; font-size: 10px; padding: 10px; border: 1px solid #333; }

<div class="sidebar">
    <h2>Конструктор v4.0</h2>

    <input type="text" id="gh-root" value="https://lindtjulia1-web.github.io/AUDIOPLAYER2/">
    
    <label>Размеры (Ш х В)</label>
    <div class="row">
        <input type="number" id="p-w" value="480" oninput="updatePreview()">
        <input type="number" id="p-h" value="200" oninput="updatePreview()">
    </div>
    
    <label>Цвета (Корпус | Иконки | Акцент)</label>
    <div class="row">
        <input type="color" id="clr-bg" value="#22222b" oninput="updatePreview()">
        <input type="color" id="clr-s" value="#00d4ff" oninput="updatePreview()">
        <input type="color" id="clr-p" value="#ff0055" oninput="updatePreview()">
    </div>

    <label>Плейлист</label>
    <textarea id="playlist-data" rows="3" oninput="updatePreview()">Track 01 | 1.mp3
Track 02 | 2.mp3</textarea>

    <button class="btn-gen" onclick="showCode()">ПОЛУЧИТЬ КОД ДЛЯ GENIALLY</button>

<div class="preview-area">
    <div id="iframe-wrap"><div id="iframe-container"></div></div>
</div>

    <button class="btn-gen" style="background:#333; color:#fff;" onclick="document.getElementById('code-box').style.display='none'">ЗАКРЫТЬ</button>
